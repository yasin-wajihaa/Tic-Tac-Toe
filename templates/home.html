<!DOCTYPE html>
<html lang="eng">
    <head>
        <meta charset="urf-8">
        <title>TIC-TAC-TOE</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Libertinus+Keyboard&family=Monoton&family=Nosifer&family=Playwrite+AU+QLD:wght@100..400&family=Playwrite+NG+Modern:wght@100..400&family=Rubik+Glitch&family=Rubik+Wet+Paint&family=Snowburst+One&display=swap" rel="stylesheet">
        
        <link href="https://fonts.googleapis.com/css2?family=Geostar&family=Handjet:wght@100..900&family=Libertinus+Keyboard&family=Monoton&family=Nosifer&family=Playwrite+AU+QLD:wght@100..400&family=Playwrite+NG+Modern:wght@100..400&family=Rubik+Glitch&family=Rubik+Wet+Paint&family=Snowburst+One&family=Train+One&family=VT323&family=Warnes&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">



    </head>
    <body>
        <!-- Invisible SVG filter used for glow effect -->
        <svg width="0" height="0" aria-hidden="true">
            <filter id="glow" x="-50%" y="-200%" width="200%" height="500%" primitiveUnits="objectBoundingBox">
                <feGaussianBlur stdDeviation=".025 .2" />
                <feColorMatrix type="saturate" values="1.3" />
                <feBlend in="SourceGraphic" />
            </filter>
        </svg>


        <h1 >TIC-TAC-BOOM</h1>
        
        <div class="main-box">
            <h2>Choose your mode</h2>
            <div class="select-btn">
                <button id="pvp-btn">PLAYER vs PLAYER</button>
                <button id="pvc-btn">PLAYER vs COMPUTER</button>
            </div>

        </div>
    </body>
</html>
